<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1413">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oligar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Oligar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: app de una columna, tres pestañas fijas abajo (Nueva, Guardadas, Precios), barra de total fija sobre las pestañas. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --fg:#13211F; --muted:#5C6E6B; --line:#D5DEDC;
  --accent:#0E6B62; --accent-fg:#FFFFFF; --chip:#E1EBE9; --danger:#B3261E; --scrim:rgba(10,20,18,.5);
  --font-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1716; --surface:#16231F; --fg:#E6F0EE; --muted:#93A8A4; --line:#27403B;
    --accent:#4FC3B5; --accent-fg:#06201C; --chip:#1F332F; --danger:#FF8A80; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#16231F; --fg:#E6F0EE; --muted:#93A8A4; --line:#27403B;
  --accent:#4FC3B5; --accent-fg:#06201C; --chip:#1F332F; --danger:#FF8A80; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; overscroll-behavior:none; touch-action:manipulation}
body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text; user-select:text}
a,img,button{-webkit-user-drag:none}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.4;
  padding-top:max(18px, env(safe-area-inset-top,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-bottom:calc(170px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
main{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
h1{font-family:var(--font-display); font-size:26px; line-height:1.1; margin:0; letter-spacing:-.01em}
h2{font-family:var(--font-display); font-size:18px; margin:0}
.sub{color:var(--muted); font-size:14px; margin:4px 0 0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px}
label,.lbl{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:5px}
input,textarea,button{font:inherit}
input[type=text],input[type=tel],input[type=number],input[type=search],input[type=date],input[type=time],textarea{
  width:100%; min-width:0; font-size:17px; color:var(--fg); background:var(--bg);
  border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-variant-numeric:tabular-nums;
}
textarea{resize:vertical; min-height:64px; font-size:16px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row > div{min-width:0}
input[type=date],input[type=time]{min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; min-height:46px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.between{display:flex; justify-content:space-between; align-items:center; gap:10px}
.seg{display:inline-flex; background:var(--chip); border-radius:10px; padding:3px; gap:3px}
.seg button{border:0; background:transparent; color:var(--muted); font-size:14px; font-weight:700; padding:7px 14px; border-radius:8px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.18)}
.btn{border:0; background:var(--accent); color:var(--accent-fg); font-weight:700; font-size:16px; padding:12px 18px; border-radius:11px; cursor:pointer}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
.btn.dashed{background:transparent; color:var(--accent); border:1px dashed var(--accent)}
.btn.small{font-size:14px; padding:8px 12px}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; margin-right:4px}
.link{border:0; background:transparent; color:var(--muted); text-decoration:underline; font-size:13px; cursor:pointer; padding:4px 0}
.link.danger{color:var(--danger)}
.link.accent{color:var(--accent)}
.iname{font-weight:700; font-size:17px; overflow-wrap:anywhere}
.idesc{margin:2px 0 0; font-size:14px; color:var(--muted); overflow-wrap:anywhere; white-space:pre-wrap}
.itotal{display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-top:1px solid var(--line); padding-top:10px}
.itotal b{font-family:var(--font-display); font-size:22px; font-variant-numeric:tabular-nums}
.info{font-size:13px; color:var(--muted)}
.empty{background:transparent; border:1px dashed var(--line); border-radius:14px; padding:22px 16px; text-align:center; color:var(--muted)}
.banner{background:var(--chip); border-radius:12px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px}
nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); z-index:20}
nav button{flex:1; border:0; background:transparent; color:var(--muted); padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:700; cursor:pointer}
nav button svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
#gear{position:fixed; top:max(10px, env(safe-area-inset-top,0px)); right:max(14px, env(safe-area-inset-right,0px)); z-index:8; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--fg); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer}
#gear[hidden]{display:none}
#gear svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
main header h1{padding-right:50px}
.bar{position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom,0px)); z-index:15; background:var(--accent); color:var(--accent-fg);
  padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px))}
.bar-in{max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px}
.bar .k{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; opacity:.85}
.bar .tot{font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums}
.bar .btn{background:var(--accent-fg); color:var(--accent)}
.group,.tg{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:0 14px}
.tg .tg{background:var(--bg)}
.group summary,.tg summary{cursor:pointer; padding:13px 0; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px}
.group summary::-webkit-details-marker,.tg summary::-webkit-details-marker{display:none}
.group summary::after,.tg summary::after{content:"+"; color:var(--muted); font-size:22px; line-height:1}
.group[open] summary::after,.tg[open] summary::after{content:"–"}
.tg summary > span:first-child{min-width:0; flex:1}
.gbody,.tgb{display:flex; flex-direction:column; gap:12px; padding-bottom:14px}
.tgb{gap:8px}
.prow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.tgb > .prow:first-child{border-top:0}
.prow .pn{min-width:0; font-weight:500; overflow-wrap:anywhere}
.prow .pr{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.prow .pr b{font-size:17px; display:block}
.prow .pr small{color:var(--muted); font-size:12px}
.tabs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.tabs button{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:11px; padding:9px 4px; font-weight:700; font-size:14px; cursor:pointer; display:flex; flex-direction:column; gap:2px; align-items:center}
.tabs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.tabs small{font-weight:500; font-size:12px; opacity:.9; font-variant-numeric:tabular-nums}
.lres{display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-top:1px solid var(--line); padding-top:8px}
.lres b{font-family:var(--font-display); font-size:24px; font-variant-numeric:tabular-nums}
.sec{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:18px 16px; cursor:pointer}
.sec b{font-family:var(--font-display); font-size:20px}
.sec small{display:block; color:var(--muted); font-size:13px; margin-top:2px}
.sec .chev{color:var(--accent); font-size:26px; line-height:1}
.sec-sticky{position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:8px; background:var(--accent); color:var(--accent-fg); border-radius:12px; padding:6px 8px 6px 4px; padding-top:calc(6px + env(safe-area-inset-top,0px)); margin-top:-12px; box-shadow:0 2px 10px rgba(0,0,0,.18)}
.sec-title{flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:transparent; border:0; color:inherit; text-align:left; padding:8px 10px; cursor:pointer; font-family:var(--font-display); font-size:21px; font-weight:700}
.sec-title .chev{font-size:28px; line-height:1}
.sec-sticky .btn.ghost{color:var(--accent-fg); border-color:var(--accent-fg)}
.vg{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.vg-h{margin:0; background:var(--accent); color:var(--accent-fg); padding:12px 14px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-family:var(--font-display); font-size:19px; line-height:1.2}
.vg-h small{font-family:var(--font-body); font-size:13px; font-weight:500; opacity:.85; white-space:nowrap}
.vg-b{padding:0 14px 6px}
.vs-h{margin:16px 0 2px; padding-bottom:6px; border-bottom:2px solid var(--accent); color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.vs-h small{font-weight:500; letter-spacing:0; text-transform:none; color:var(--muted); font-size:12px}
.vs-h.d2{font-size:12px; margin-top:12px; border-bottom-width:1px}
.vs-h + .prow, .vg-b > .prow:first-child{border-top:0}
.quote{border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:8px}
.ql{display:flex; justify-content:space-between; gap:10px; font-size:14px}
.ql span:first-child{min-width:0; overflow-wrap:anywhere}
.ql span:last-child{font-variant-numeric:tabular-nums; white-space:nowrap}
.qtot{display:flex; justify-content:space-between; font-weight:700}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.line{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:10px}
.line input[type=text],.line input[type=number]{background:var(--surface)}
.sharebox textarea{min-height:200px; font-size:15px; line-height:1.45}
a.btn{text-decoration:none; text-align:center; display:inline-block}
#modal{position:fixed; inset:0; z-index:40; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center}
#modal[hidden]{display:none}
.panel{background:var(--surface); width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; max-height:85vh; overflow-y:auto}
.plist{overflow-y:auto; display:flex; flex-direction:column; gap:0; min-height:0}
.pick{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:transparent; color:var(--fg); padding:13px 2px; cursor:pointer}
.pick:first-child{border-top:0}
.pick small{display:block; color:var(--muted); font-size:13px}
.pick .pp{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(140px + env(safe-area-inset-bottom,0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; z-index:50; max-width:90vw}
#toast[hidden]{display:none}
#login{position:fixed; inset:0; z-index:45; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto}
#login[hidden]{display:none}
#login form{width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px}
#login h1{margin:0; font-family:var(--font-display); font-size:30px}
#lerr{min-height:20px; font-size:14px; color:var(--muted); margin:0}
#splash{position:fixed; inset:0; z-index:100; background:#fff; display:flex; align-items:center; justify-content:center; animation:splashout .6s ease 1.9s forwards}
#splash img{width:min(62vw,280px); height:auto; opacity:0; transform:scale(.94); animation:logoin .8s ease .15s forwards}
#splash.out{animation:none; opacity:0; visibility:hidden; transition:opacity .3s}
@keyframes logoin{to{opacity:1; transform:none}}
@keyframes splashout{to{opacity:0; visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash img{animation:none; opacity:1; transform:none}}
.hide{display:none!important}
@media (max-width:360px){.row3{grid-template-columns:1fr 1fr}}
/* ===== Rediseño v19 ===== */
:root{
  --bg:#EDF3F1; --bg2:#F8FBFA; --line:#DCE6E3; --chip:#E3EEEB;
  --accent:#0B5F57; --accent2:#12877A; --ink:#0A1F1C;
  --sh1:0 1px 2px rgba(10,40,35,.06); --sh2:0 1px 2px rgba(10,40,35,.05),0 8px 22px rgba(10,40,35,.08);
  --hero:linear-gradient(135deg,#08423D 0%,#0B5F57 55%,#12877A 100%);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B1413; --bg2:#101D1B; --accent:#4FC3B5; --accent2:#2FA394; --ink:#E6F0EE;
    --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 8px 22px rgba(0,0,0,.35); --hero:linear-gradient(135deg,#0B2E2A 0%,#0F4B44 60%,#14665C 100%); }
}
:root[data-theme="dark"]{ --bg:#0B1413; --bg2:#101D1B; --accent:#4FC3B5; --accent2:#2FA394; --ink:#E6F0EE; --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 8px 22px rgba(0,0,0,.35); --hero:linear-gradient(135deg,#0B2E2A 0%,#0F4B44 60%,#14665C 100%); }
body{background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 340px) fixed var(--bg)}
h1{font-size:28px; letter-spacing:-.02em}
.card,.group,.tg,.sec,.vg,.empty{border-radius:var(--r)}
.card,.group,.sec,.vg{box-shadow:var(--sh2); border-color:color-mix(in srgb,var(--line) 55%,transparent)}
.card{padding:16px}
.sec{padding:20px 18px; transition:transform .12s}
.sec:active{transform:scale(.985)}
input[type=text],input[type=tel],input[type=number],input[type=search],input[type=date],input[type=time],textarea{
  border-radius:12px; background:var(--surface); border:1.5px solid var(--line); padding:13px 14px; min-height:48px; transition:border-color .15s, box-shadow .15s}
input:focus,textarea:focus{outline:none; border-color:var(--accent2); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 18%,transparent)}
.line input[type=text],.line input[type=number]{background:var(--bg2)}
.btn{min-height:50px; border-radius:14px; background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%); box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent); transition:transform .1s, box-shadow .15s}
.btn:active{transform:scale(.97); box-shadow:0 1px 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ghost{background:var(--surface); border:1.5px solid var(--accent); box-shadow:none; color:var(--accent)}
.btn.dashed{background:transparent; box-shadow:none; border:1.5px dashed var(--accent)}
.btn.small{min-height:40px; font-size:14px; border-radius:12px}
.seg{border-radius:12px; padding:4px}
.seg button{border-radius:9px}
.tabs button{border-radius:14px; box-shadow:var(--sh1); border-color:transparent; padding:11px 4px}
.tabs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
nav{background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(10,40,35,.06)}
nav button{margin:6px 6px 4px; padding:7px 4px 6px; border-radius:14px; transition:background .15s}
nav button[aria-current="page"]{background:var(--chip); color:var(--accent)}
#gear{color:var(--fg); box-shadow:var(--sh2); border-color:transparent}
.bar{background:var(--hero); border-radius:20px 20px 0 0; box-shadow:0 -8px 24px rgba(10,40,35,.18)}
.bar .btn{background:#fff; color:#0B5F57; box-shadow:none}
.sec-sticky,.vg-h{background:var(--hero)}
.panel{border-radius:22px 22px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.banner{border-radius:14px}
#toast{border-radius:14px; box-shadow:var(--sh2)}
#login{background:var(--hero); color:#fff}
#login .sub,#lerr{color:rgba(255,255,255,.8)}
#login label{color:rgba(255,255,255,.75)}
#login h1{font-size:36px}
#login input{background:#fff; color:#13211F; border-color:transparent}
#login .btn{background:#fff; color:#0B5F57; box-shadow:none}
#login .btn.ghost{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.7)}
#login .link.accent{color:#fff}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
#app > *{animation:rise .28s ease both}
@media (prefers-reduced-motion:reduce){#app > *{animation:none}}
/* Panel de inicio */
.hero{background:var(--hero); color:#fff; border-radius:22px; padding:20px 18px 16px; box-shadow:0 10px 28px rgba(8,66,61,.28); position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.07)}
.hero small{display:block; opacity:.8; font-size:13px}
.hero .brand{font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:.14em; margin:2px 0 2px}
.hero p{margin:0; opacity:.88; font-size:14px}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; position:relative; z-index:1}
.stat{background:rgba(255,255,255,.14); border-radius:14px; padding:10px 12px}
.stat b{display:block; font-family:var(--font-display); font-size:28px; line-height:1.1}
.stat span{font-size:12px; opacity:.85}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{display:flex; flex-direction:column; align-items:flex-start; gap:10px; text-align:left; background:var(--surface); color:var(--fg); border:0; border-radius:var(--r); padding:16px 14px; box-shadow:var(--sh2); font-weight:700; font-size:15px; cursor:pointer; transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:42px; height:42px; border-radius:13px; background:var(--chip); color:var(--accent); display:flex; align-items:center; justify-content:center}
.tile .ic svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.tile.main{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; grid-column:1/-1; flex-direction:row; align-items:center; font-size:19px; padding:18px 16px; box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile.main .ic{background:rgba(255,255,255,.2); color:#fff}
.stitle{display:flex; justify-content:space-between; align-items:baseline; margin:6px 2px -4px}
.stitle h2{font-size:17px}
.li{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); color:var(--fg); border:0; border-radius:14px; padding:12px 14px; box-shadow:var(--sh1); cursor:pointer}
.li .t{min-width:0; display:flex; flex-direction:column}

:root{

}
@media (prefers-color-scheme: dark){

function applySeed(d){
  /* nombres que cambiaron */
  d.products.forEach(function(p){
    if(p.path[0] === "Alfombra" && p.path.length === 1){
      if(p.n === "Fairmount") p.n = "Fairmont";
      if(p.n === "Karet") p.n = "Karat";
      if(p.n === "Leeds II" && !(p.p > 0)){ p.n = "Leeds II (posiblemente descontinuada)"; p.full = "Alfombra Leeds II"; }
      if(p.n === "Scorpio" && !(p.p > 0)){ p.n = "Scorpio (posiblemente descontinuada)"; p.full = "Alfombra Scorpio"; }
    }
  });
  /* nombres que cambiaron */
  var REN = {"Trends":"Voile Trends", "Sparkling":"Colección Sparkling", "Colección Especia Black Out":"Colección Especial Black Out"};
  d.products.forEach(function(p){
    if(p.path[0] === "Cortinas" && REN[p.path[1]]) p.path[1] = REN[p.path[1]];
    if(p.n === "Duo Radiance" && p.path[0] === "Persianas") p.n = "Duo Radiange";
    if(p.n === "Erismann" && p.path[0] === "Papel tapiz"){ p.n = "Fashion for Walls"; if(p.full) p.full = "Papel tapiz Fashion for Walls"; }
  });
  /* Pertina: solo quedan estos modelos */
  var OLDP = ["Silver","Gold","Titanium","Perla","Citrino","Onix","Sunset","Luvina","Serenity"];
  d.products = d.products.filter(function(p){ return !(p.path[0] === "Pertina" && OLDP.indexOf(p.n) >= 0 && !(p.p > 0) && !(p.c > 0)); });
  /* colecciones que ya tienen modelos: quitar el renglón provisional */
  var real = {};
  seedAll().forEach(function(sp){ if(sp.path[0] === "Cortinas" && sp.n !== "Modelos por agregar") real[sp.path[1]] = true; });
  d.products = d.products.filter(function(p){ return !(p.n === "Modelos por agregar" && p.path[0] === "Cortinas" && real[p.path[1]] && !(p.p > 0) && !(p.c > 0)); });

  var map = {};
  d.products.forEach(function(p){ map[pkey(p)] = p; });
  seedAll().forEach(function(sp){
    var ex = map[pkey(sp)];
    if(ex){
      if(!(ex.p > 0)) ex.p = sp.p;
      if(!(ex.c > 0)) ex.c = sp.c;
      if(!ex.ancho && sp.ancho) ex.ancho = sp.ancho;
      if(sp.path[0] === "Cortinas") ex.type = "metro";
      if(sp.path[0] === "Pertina") ex.type = "pieza";
      if(!ex.full && sp.full) ex.full = sp.full;

      sp.id = uid();
      d.products.push(sp); map[pkey(sp)] = sp;
    }
  });
}
function migrate(d){
  d.quotes.forEach(function(q){
    (q.items || []).forEach(function(it){
      if(!it.lines) it.lines = [{w:it.w || "", h:it.h || "", area:it.area || "", color:"", qty:it.qty || 1}];
    });
    if(!q.payments) q.payments = [];
  });
  d.products.forEach(function(p){ if(!p.path) p.path = []; });
  var v = d.v || 0;
  if(v < 6){
    d.products = d.products.filter(function(p){
      var s1 = p.id === "p1" && p.n === "Puerta plegable" && p.c === 800 && p.p === 1400;
      var s2 = p.id === "p2" && p.n === "Persiana Sheer Elegance Blackout" && p.c === 600 && p.p === 1300;
      return !(s1 || s2);
    });
  }
  if(v >= 6 && v < 8){
    d.products.forEach(function(p){
      if(/^s\d+$/.test(p.id) && p.path.length === 2 && /^Persiana\s/.test(p.path[0])) p.path = ["Persianas", p.path[0].replace(/^Persiana\s+/, ""), p.path[1]];
    });
  }
  if(v < 8){
    d.products.forEach(function(p){ if(!p.path.length) p.path = ["Otros"]; });
  }
  if(v < SEED_V){
    applySeed(d);
    d.v = SEED_V;
  }
  if(!d.appts) d.appts = [];
  if(!d.sections) d.sections = SECTIONS.slice();
  if(d.sections.indexOf("Cortinas") < 0){
    var ip = d.sections.indexOf("Persianas");
    d.sections.splice(ip >= 0 ? ip + 1 : d.sections.length, 0, "Cortinas");
  }
  d.products.forEach(function(p){ if(p.path[0] && d.sections.indexOf(p.path[0]) < 0) d.sections.push(p.path[0]); });
}
function load(){

    if(raw){ var s = JSON.parse(raw); if(s && Array.isArray(s.products) && Array.isArray(s.quotes)){ migrate(s); return s; } }
  }catch(e){}
  var d = {v:0, minM2:1, products:[], quotes:[], appts:[]};
  migrate(d);
  return d;
}

  return {ok:true, form:"recto", meters:mr, lienzos:lienzos, len:len, reduced:false};
}
function calcLine(it, l, d){
  if(it.type === "cort"){
    var cr = cortCalc(it, l);
    var base = cr.ok ? cr.meters * num(it.price) * lqty(l) : 0;
    var rod = (it.rod && num(l.w) > 0) ? num(l.w) * lqty(l) * num(it.rodPrice) : 0;
    return {area:0, billed:0, minApplied:false, base:base, rod:rod, total: base + rod};
  }
  if(it.type === "pieza") return {area:0, billed:0, minApplied:false, total:num(it.price) * lqty(l)};
  if(it.type === "metro") return {area:0, billed:0, minApplied:false, total:num(it.price) * num(l.meters)};

  return {area:area, billed:billed, minApplied: useMin && area > 0 && area < (d.min || 0), total: billed * num(it.price) * lqty(l)};
}

/* ---------- v21: costos y ventas ---------- */
function prodOf(it){ return it.pid ? db.products.filter(function(p){ return p.id === it.pid; })[0] : null; }
function itemCostUnit(it){ if(num(it.cost) > 0) return num(it.cost); var p = prodOf(it); return p && num(p.c) > 0 ? num(p.c) : 0; }

/* ---------- Árbol de la lista de precios ---------- */
function fullName(p){

}
function keyOf(path){ return path.join("\u001f"); }

function buildTree(list, sectioned){
  var root = {name:"", children:[], products:[], path:[], sectioned:!!sectioned};
  list.forEach(function(p){
    var node = root;
    (p.path || []).forEach(function(seg){
      var ch = node.children.filter(function(c){ return c.name === seg; })[0];
      if(!ch){ ch = {name:seg, children:[], products:[], path:node.path.concat([seg])}; node.children.push(ch); }
      node = ch;
    });
    node.products.push(p);
  });
  (function mn(n){
    var m = Infinity;
    n.products.forEach(function(p){ m = Math.min(m, posP(p)); });
    n.children.forEach(function(c){ m = Math.min(m, mn(c)); });
    n.min = m; return m;

}

  if(node.sectioned) return arr;
  node.products.forEach(function(p){ arr.push({k:"p", p:p, min:posP(p), name:p.n}); });
  arr.sort(function(a,b){

}

function sectionRoot(list, includeEmpty){

/* ---------- Mensajes ---------- */
function fmtM(v){ return String(Number(v.toFixed(3))); }
function lineLabel(it, l, d, forClient){
  var q = lqty(l), color = (l.color || "").trim(), s;
  if(it.type === "cort"){
    s = (num(l.w) > 0 && num(l.h) > 0) ? String(l.w).trim().replace(",", ".") + "x" + String(l.h).trim().replace(",", ".") : (forClient ? "Sin medidas" : "Pendiente de medidas");
    if(color) s += " " + color;
    if(q > 1) s += " (" + q + " pzas)";
    return s;
  }
  if(it.type === "metro"){
    var mt = num(l.meters);
    s = mt > 0 ? fmtM(mt) + " m" : (forClient ? "Sin medidas" : "Pendiente de medidas");
    return color ? s + " " + color : s;
  }
  if(it.type === "pieza"){
    s = color;
    if(!s) s = q + (q === 1 ? " pza" : " pzas");
    else if(q > 1) s += " (" + q + " pzas)";
    return s;
  }
  var w = num(l.w), h = num(l.h);
  if(it.mode === "med" && w > 0 && h > 0){
    if(d.unit === "cm") s = fmtM(w / 100) + "x" + fmtM(h / 100);
    else s = String(l.w).trim().replace(",", ".") + "x" + String(l.h).trim().replace(",", ".");
  } else if(it.mode === "m2" && num(l.area) > 0){
    s = fmtM(num(l.area)) + (it.pid ? " m²" : "");
  } else s = forClient ? "Sin medidas" : "Pendiente de medidas";
  if(color) s += " " + color;
  if(q > 1) s += " (" + q + " pzas)";
  return s;
}
function groupItems(items){
  var groups = [], idx = {};
  items.forEach(function(it){
    var key = (it.name || "").trim().toLowerCase();
    if(key && idx[key] !== undefined){ groups[idx[key]].items.push(it); return; }
    if(key) idx[key] = groups.length;
    groups.push({name:(it.name || "").trim(), items:[it]});
  });
  return groups;
}
function textProveedor(d){
  var used = usedTabs(d), multi = used.length > 1, out = [];
  used.forEach(function(t){
    var blocks = groupItems(tabItems(d, t[0])).map(function(g){
      var rows = [], sum = 0;
      g.items.forEach(function(it){
        it.lines.forEach(function(l){
          var lab = lineLabel(it, l, d, false);
          if(it.type === "cort"){
            var r = cortCalc(it, l);
            if(r.ok){
              var m = r.meters * lqty(l); sum += m;
              rows.push((r.form === "recto" ? (r.lienzos * lqty(l)) + (r.lienzos * lqty(l) === 1 ? " lienzo" : " lienzos") + " de " + fmtM(r.len) + " m = " : "") + fmtM(m) + " m — " + lab);
            } else rows.push("Pendiente — " + lab);
          } else rows.push(lab);
        });
      });
      if(sum > 0 && rows.length > 1) rows.push("Total: " + fmtM(sum) + " m");
      return ((g.name || t[0] === "cort") ? "*" + (g.name || "Cortina") + "*\n" : "") + rows.join("\n");
    });
    out.push((multi ? "*— " + t[1] + " —*\n" : "") + blocks.join("\n\n"));
  });
  return out.join("\n\n");
}
function textCliente(d){
  var head = ["*Cotización*"];
  if(d.client && d.client.name) head.push("Cliente: " + d.client.name);
  head.push(new Date(d.updatedAt || Date.now()).toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}));
  var out = [head.join("\n")];
  var used = usedTabs(d), multi = used.length > 1;
  used.forEach(function(t){
    var blocks = [];
    if(t[0] === "cort"){
      var rows = [];
      tabItems(d, "cort").forEach(function(it){
        it.lines.forEach(function(l){
          var ct = calcLine(it, l, d);
          rows.push("Cortina " + (it.model || it.name || "") + " " + lineLabel(it, l, d, true) + (ct.base > 0 ? " — " + money(ct.base) : ""));
          if(it.rod){ rows.push(rodLabel(it, l) + " — " + money(ct.rod)); rows.push("Total cortina: " + money(ct.total)); }
        });
        if(it.own) rows.push(it.own);
      });
      blocks.push(rows.join("\n"));
    } else {
      groupItems(tabItems(d, t[0])).forEach(function(g){
        var rows = ["*" + (g.name || "Producto") + "*"], seen = {};
        g.items.forEach(function(it){ if(it.note && !seen[it.note]){ seen[it.note] = 1; rows.push(it.note); } });
        g.items.forEach(function(it){
          it.lines.forEach(function(l){
            var tt = calcLine(it, l, d).total;
            rows.push(lineLabel(it, l, d, true) + (tt > 0 ? " — " + money(tt) : ""));
          });
          if(it.own) rows.push(it.own);
        });
        blocks.push(rows.join("\n"));
      });
    }
    out.push((multi ? "*— " + t[1] + " —*\n" : "") + blocks.join("\n\n"));
  });
  var total = draftTotal(d), paid = paidOf(d), tail = ["*Total: " + money(total) + "*"];
  if(paid > 0){
    tail.push("Pagado: " + money(paid));
    tail.push("*Resta: " + money(Math.max(0, total - paid)) + "*");
  }
  out.push(tail.join("\n"));
  return out.join("\n\n");
}

function appBack(){

  if(!$("#modal").hidden) closeModal();
  else if(!$("#login").hidden) handled = true;
  else if(view !== "new"){ var bt = backTo; backTo = "new"; if(bt === view) bt = "new"; go(bt); }
  else if(apptDraft){ apptDraft = null; var ar = apptReturn; apptReturn = "new"; if(ar === "appts") go("appts"); else { setBar(); renderNew(); window.scrollTo(0,0); } }
  else if(draft.step === 2){ draft.step = 1; renderNew(); setBar(); window.scrollTo(0,0); }
  else if(draft.step === 3 || (draft.started && !hasWork())){ draft = newDraft(); leaveQuote(); }

  else handled = false;
  return handled;
}

function updateTotals(){
  document.querySelectorAll("#items [data-i]").forEach(function(c){
    var it = draft.items[Number(c.dataset.i)]; if(!it) return;
    var l = it.lines[0], lr = calcLine(it, l, draft), info = "";
    if(it.type === "cort"){
      var cr = cortCalc(it, l);
      info = !cr.ok ? cr.msg : (cr.form === "volt"
        ? "Tela volteada · " + fmtM(cr.meters * lqty(l)) + " m lineales" + (cr.reduced ? " · bastilla reducida" : "")
        : (cr.lienzos * lqty(l)) + (cr.lienzos * lqty(l) === 1 ? " lienzo" : " lienzos") + " de " + fmtM(cr.len) + " m · " + fmtM(cr.meters * lqty(l)) + " m lineales");
    } else if(it.type === "m2"){
      if(it.mode === "m2") info = lr.area > 0 ? (it.pid ? fmtM(lr.area) + " m²" : "") : "Captura la cantidad";
      else if(lr.area > 0){ info = "Área cobrada: " + N2.format(lr.billed) + " m²" + (lqty(l) > 1 ? " × " + lqty(l) : ""); if(lr.minApplied) info += " (mínimo)"; }
      else info = "Captura las medidas";
    } else if(it.type === "metro"){
      info = num(l.meters) > 0 ? fmtM(num(l.meters)) + " m" : "Captura los metros";
    } else info = lqty(l) + (lqty(l) === 1 ? " pieza" : " piezas");
    if(!String(it.price).trim()) info += " · Falta el precio";
    if(it.type === "cort"){
      var lb = c.querySelector('[data-role="lbr"]'), lrr = c.querySelector('[data-role="lrr"]');
      if(lb){
        var has = !!it.rod;
        lb.classList.toggle("hide", !has); lrr.classList.toggle("hide", !has);
        if(has){
          c.querySelector('[data-role="lb"]').textContent = money(lr.base);
          c.querySelector('[data-role="lrl"]').textContent = rodLabel(it, l);
          c.querySelector('[data-role="lrv"]').textContent = money(lr.rod);
          if(!(num(it.rodPrice) > 0)) info += " · Falta el precio del cortinero en Herrajes";
        }
      }
      c.querySelectorAll("[data-rod]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.rod === (it.rod || ""))); });
    }
    c.querySelector('[data-role="lt"]').textContent = money(lr.total);
    c.querySelector('[data-role="li"]').textContent = info;
    c.querySelector(".rst").classList.toggle("hide", it.listPrice == null || num(it.price) === it.listPrice);
  });

}

function openPicker(i){

        if(posP(a) !== posP(b)) return posP(a) < posP(b) ? -1 : 1;

    }

    var b = e.target.closest("[data-pid]");
    if(b){
      var p = db.products.filter(function(x){ return x.id === b.dataset.pid; })[0];
      var it = draft.items[i];
      if(p && it){
        delete it.cost; delete it.rodCost; delete it.rodCostKind;
        it.pid = p.id; it.name = fullName(p); it.type = tab === "cort" ? "cort" : p.type; it.note = p.note || "";
        if(tab === "cort"){ it.model = p.n; it.roll = p.ancho > 0 ? String(p.ancho) : it.roll; }
        it.price = p.p > 0 ? String(p.p) : ""; it.listPrice = p.p > 0 ? p.p : null; it.inh = false;

    if(e.target === m || mb) closeModal();

}

function saveQuote(){
  var now = Date.now();
  var payments = clone(draft.payments || []);
  if(!payments.length && num(draft.anticipo) > 0) payments.push({id:uid(), amount:num(draft.anticipo), date:now});
  var q = {
    id: draft.id || uid(), createdAt: draft.createdAt || now, updatedAt: now,
    unit: "m", min: draft.min,
    client: {name: draft.client.name.trim(), phone: draft.client.phone.trim(), calle: draft.client.calle.trim(), numero: draft.client.numero.trim(), colonia: draft.client.colonia.trim(), ciudad: (draft.client.ciudad || "").trim(), estado: (draft.client.estado || "").trim(), address: (draft.client.address || "").trim()},
    apptId: draft.apptId || null,
    items: draft.items.map(function(it){
      var o = clone(it); o.showNote = false; delete o.inh; o.total = calc(it, draft).total; o.price = num(it.price);
      var cu = itemCostUnit(it), ru = rodCostUnit(it);
      if(cu > 0) o.cost = cu; else delete o.cost;
      if(ru > 0){ o.rodCost = ru; o.rodCostKind = it.rod; } else { delete o.rodCost; delete o.rodCostKind; }
      return o;
    }),
    total: draftTotal(draft),
    payments: payments,
    costOverride: draft.costOverride
  };
  var idx = -1;
  db.quotes.forEach(function(x,i){ if(x.id === q.id) idx = i; });
  if(idx >= 0) db.quotes[idx] = q; else db.quotes.push(q);
  if(draft.apptId){
    var ap = (db.appts || []).filter(function(a){ return a.id === draft.apptId; })[0];
    if(ap){ ap.done = true; ap.quoteId = q.id; ap.updatedAt = Date.now(); }
  }
  persist();
  lastSaved = q;
  draft = newDraft(); draft.step = 3;
  toast("Cotización guardada");
  renderNew(); setBar(); window.scrollTo(0,0);
}

var STAT = {range:"month", off:0};
function fshort(t){ return new Date(t).toLocaleDateString("es-MX", {day:"numeric", month:"short"}).replace(".", ""); }
function statPeriod(){
  var now = new Date(), s, e, label;
  if(STAT.range === "year"){ var y = now.getFullYear() + STAT.off; s = new Date(y, 0, 1); e = new Date(y + 1, 0, 1); label = String(y); }
  else if(STAT.range === "week"){
    var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), wd = (d0.getDay() + 6) % 7;
    s = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() - wd + 7 * STAT.off); e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7);
    label = fshort(s.getTime()) + " – " + fshort(e.getTime() - 86400000);
  } else { s = new Date(now.getFullYear(), now.getMonth() + STAT.off, 1); e = new Date(s.getFullYear(), s.getMonth() + 1, 1); label = s.toLocaleDateString("es-MX", {month:"long", year:"numeric"}).replace(" de ", " "); label = label.charAt(0).toUpperCase() + label.slice(1); }
  return {s:s.getTime(), e:e.getTime(), label:label};
}
function costBar(rev, cost){
  var c = rev > 0 ? Math.min(100, Math.max(0, cost / rev * 100)) : 0;
  return '<div class="sbar2"><i class="c" style="width:' + c + '%"></i><i class="g" style="width:' + (rev > 0 ? Math.max(0, 100 - c) : 0) + '%"></i></div>';
}
function renderStats(){

  var sales = db.quotes.filter(function(q){ var t = saleDate(q); return isSold(q) && t >= P.s && t < P.e; }).sort(function(a, b){ return saleDate(b) - saleDate(a); });
  var infos = sales.map(saleInfo);
  var rev = 0, cost = 0, miss = 0;
  infos.forEach(function(i){ rev += i.rev; cost += i.cost; miss += i.missing; });
  var profit = rev - cost;
  var secs = {};
  sales.forEach(function(q){ saleInfo(q).parts.forEach(function(p){ var k = secOf(p.it); secs[k] = secs[k] || {rev:0, cost:0}; secs[k].rev += p.rev; secs[k].cost += p.cost; }); });
  var skeys = Object.keys(secs).sort(function(a, b){ return secs[b].rev - secs[a].rev; });
  var smax = skeys.length ? secs[skeys[0]].rev || 1 : 1;
  var seg = [["week", "Semana"], ["month", "Mes"], ["year", "Año"]].map(function(o){ return '<button type="button" data-st="' + o[0] + '" aria-pressed="' + (STAT.range === o[0]) + '">' + o[1] + '</button>'; }).join("");

    '<section class="card"><div class="sumgrid"><div><span>Vendido</span><b>' + money(rev) + '</b></div><div><span>Costo</span><b>' + money(cost) + '</b></div><div class="gain"><span>Ganancia</span><b>' + money(profit) + '</b></div></div>' +
    costBar(rev, cost) + '<div class="legend"><em>Costo</em><em class="g">Ganancia' + (rev > 0 ? " · " + pct(profit, rev) + "%" : "") + '</em></div>' +
    (miss ? '<div class="warn">' + miss + (miss === 1 ? " partida sin costo capturado" : " partidas sin costo capturado") + ': captura el costo en la lista de precios o escríbelo en la cotización.</div>' : '') + '</section>';
  if(skeys.length){
    html += '<div class="stitle"><h2>Por sección</h2></div><section class="card hb">' + skeys.map(function(k){
      var v = secs[k], w = Math.max(6, Math.round(v.rev / smax * 100));

    }).join("") + '</section>';
  }

      var nm = it.type === "cort" ? "Cortina " + (it.model || it.name || "") : (it.name || "Producto");

    }).join("");
    return '<article class="card sale" data-qid="' + esc(q.id) + '"><div class="between"><div style="min-width:0"><b>' + esc(name) + '</b><div class="info">' + esc(fday(i.date)) + ' ' + payTag(q) + '</div></div><b style="font-family:var(--font-display);font-size:20px">' + money(i.rev) + '</b></div>' +
      costBar(i.rev, i.cost) +
      '<div class="tri"><span>Costo <b>' + money(i.cost) + '</b></span><span class="gain">Ganancia <b>' + money(i.profit) + (i.rev > 0 ? " (" + pct(i.profit, i.rev) + "%)" : "") + '</b></span></div>' +

function applyPrices(o, ru){
  var tmp = {v:o.v || 0, minM2:o.minM2, sections:o.sections || [], products:o.products || [], quotes:[], appts:[]};
  migrate(tmp);

function pullAll(remote){
  var changed = false;
  ["q", "a"].forEach(function(k){
    var arr = k === "q" ? db.quotes : db.appts, byId = {}, rem = {}, map = sy[k];
    arr.forEach(function(x){ byId[x.id] = x; });
    remote[k].forEach(function(d){ var j = docJ(d); if(j != null) rem[docId(d)] = j; });
    Object.keys(rem).forEach(function(id){
      var j = rem[id], L = byId[id], M = map[id], hj = hsh(j);
      if(!L){
        if(M === undefined){ try{ arr.push(JSON.parse(j)); changed = true; map[id] = hj; }catch(e){} }
        return;
      }
      var hl = hsh(JSON.stringify(L));
      if(hl === hj){ map[id] = hj; return; }
      if(M === hl){ try{ arr[arr.indexOf(L)] = JSON.parse(j); changed = true; map[id] = hj; }catch(e){} return; }
      if(M === hj) return;
      var o2; try{ o2 = JSON.parse(j); }catch(e){ return; }
      if((o2.updatedAt || 0) >= (L.updatedAt || 0)){ arr[arr.indexOf(L)] = o2; changed = true; map[id] = hj; }
    });
    Object.keys(map).forEach(function(id){
      if(rem[id] !== undefined) return;
      var L = byId[id];
      if(L && hsh(JSON.stringify(L)) === map[id]){ arr.splice(arr.indexOf(L), 1); changed = true; }
      delete map[id];
    });
  });
  var pj = remote.p ? docJ(remote.p) : null;
  if(pj != null){
    var hp = hsh(pj), hl2 = hsh(pricesStr()), M2 = sy.p, ru = docU(remote.p), take = false;
    if(hl2 === hp) sy.p = hp;
    else if(M2 === null || M2 === undefined || M2 === hl2) take = true;
    else if(M2 === hp) take = false;
    else take = ru >= (db.pu || 0);
    if(take){ try{ applyPrices(JSON.parse(pj), ru); sy.p = hp; changed = true; }catch(e){} }
  }
  return changed;
}
function pushAll(){
  var jobs = [], did = false;
  [["q", "quotes"], ["a", "appts"]].forEach(function(pair){
    var k = pair[0], col = pair[1], arr = k === "q" ? db.quotes : db.appts, map = sy[k], ids = {};
    arr.forEach(function(x){
      ids[x.id] = 1;
      var s = JSON.stringify(x), h = hsh(s);
      if(map[x.id] !== h) jobs.push(function(){ return fsPut(col + "/" + encodeURIComponent(x.id), s, x.updatedAt || 0).then(function(){ map[x.id] = h; did = true; }); });
    });
    Object.keys(map).forEach(function(id){
      if(!ids[id]) jobs.push(function(){
        return fsDel(col + "/" + encodeURIComponent(id)).then(function(){ delete map[id]; did = true; }, function(e){ if(e.status === 404){ delete map[id]; did = true; return; } throw e; });

  return jobs.reduce(function(pr, job){ return pr.then(job); }, Promise.resolve()).then(function(){ return did; });
}
function setSync(msg){ syncMsg = msg; var e = $("#syncmsg"); if(e) e.textContent = msg; }
function refreshViews(){
  try{
    if(view === "saved" && $("#glist")) fillSaved();
    else if(view === "appts") renderAppts();
    else if(view === "prices" && !editMode && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) renderPrices();
  }catch(e){}
}
function syncNow(){
  if(!auth) return Promise.resolve();
  if(syncBusy){ syncAgain = true; return Promise.resolve(); }
  syncBusy = true; setSync("Sincronizando…");
  return fsGet("meta/state").then(function(st){
    var rev = st && st.fields && st.fields.rev ? st.fields.rev.stringValue : null;
    if(rev !== sy.rev || sy.p == null){
      return Promise.all([fsList("quotes"), fsList("appts"), fsGet("meta/prices")]).then(function(r){
        if(pullAll({q:r[0], a:r[1], p:r[2]})){ saveLocal(); refreshViews(); }
        sy.rev = rev;
      });
    }
  }).then(function(){ return pushAll(); }).then(function(did){
    if(did){
      var rev = uid();
      return fs("meta/state?updateMask.fieldPaths=rev", {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({fields:{rev:{stringValue:rev}}})}).then(function(){ sy.rev = rev; });
    }
  }).then(function(){
    lsSet(SYNC_KEY, sy); syncBusy = false;
    setSync("Sincronizado " + new Date().toLocaleTimeString("es-MX", {hour:"numeric", minute:"2-digit"}));
    if(syncAgain){ syncAgain = false; setTimeout(syncNow, 300); }
  }, function(e){
    lsSet(SYNC_KEY, sy); syncBusy = false; syncAgain = false;
    if(!auth) return;
    if(e.offline) setSync("Sin conexión. Se guardará al volver internet.");
    else if(e.status === 403) setSync("Sin permiso en la nube. Revisa las reglas de Firestore.");
    else setSync("No se pudo sincronizar: " + (e.message || "error"));
  });
}
function scheduleSync(){ if(!auth) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1200); }
function startSync(){
  if(!sy) sy = lsGet(SYNC_KEY) || {};
  sy.q = sy.q || {}; sy.a = sy.a || {}; if(sy.p === undefined) sy.p = null; if(sy.rev === undefined) sy.rev = null;
  if(!syncStarted){
    syncStarted = true;
    setInterval(function(){ if(!document.hidden) syncNow(); }, 30000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) syncNow(); });
    window.addEventListener("online", function(){ syncNow(); });
  }
  syncNow();
}
/* ---------- Acceso ---------- */
function authErr(e){
  if(e.offline) return "Sin conexión. Conéctate a internet para entrar.";
  var m = (e.message || "").toUpperCase();
  if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_CREDENTIAL/.test(m)) return "Correo o contraseña incorrectos.";
  if(/EMAIL_EXISTS/.test(m)) return "Ese correo ya tiene cuenta. Toca Entrar.";
  if(/WEAK_PASSWORD/.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
  if(/TOO_MANY/.test(m)) return "Demasiados intentos. Espera unos minutos.";
  if(/OPERATION_NOT_ALLOWED|ADMIN_ONLY/.test(m)) return "El registro de cuentas nuevas está desactivado.";
  if(/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return "Escribe un correo válido.";
  return "No se pudo: " + (e.message || "error");
}
function showLogin(msg){
  var L = $("#login"); if(!L) return;
  L.hidden = false; $("#lerr").textContent = msg || "";
}
function doLogin(mode){
  var em = $("#lem").value.trim(), pw = $("#lpw").value;
  if(!em || !pw){ $("#lerr").textContent = "Escribe correo y contraseña."; return; }
  $("#lerr").textContent = "Un momento…";
  authCall(mode === "new" ? "signUp" : "signInWithPassword", {email:em, password:pw, returnSecureToken:true}).then(function(r){
    setAuth(r); $("#login").hidden = true; $("#lpw").value = "";
    toast("Sesión iniciada"); startSync();
  }, function(e){ $("#lerr").textContent = authErr(e); });
}
function doReset(){
  var em = $("#lem").value.trim();
  if(!em){ $("#lerr").textContent = "Escribe tu correo y vuelve a tocar “Olvidé mi contraseña”."; return; }
  authCall("sendOobCode", {requestType:"PASSWORD_RESET", email:em}).then(function(){
    $("#lerr").textContent = "Te mandamos un correo para cambiar la contraseña.";
  }, function(e){ $("#lerr").textContent = authErr(e); });
}
function doSignOut(expired){
  auth = null; try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
  showLogin(expired ? "Tu sesión expiró. Entra de nuevo." : "");
}
/* ---------- Exportar / respaldo / importar ---------- */
function isoDay(ts){ var d = new Date(ts), z = function(n){ return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
function csvCell(v){ var s = v == null ? "" : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvText(rows){ return "﻿" + rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n") + "\r\n"; }
function quotesCsv(){
  var rows = [["Fecha","Cliente","Celular","Calle","Número","Colonia","Ciudad","Estado","Sección","Producto","Detalle","Precio","Subtotal","Total cotización","Pagado","Resta"]];
  var tn = {med:"Medidas", cant:"Cantidad", cort:"Cortinas"};
  db.quotes.slice().sort(function(a, b){ return b.updatedAt - a.updatedAt; }).forEach(function(q){
    var first = true, paid = paidOf(q);
    (q.items || []).forEach(function(it){
      it.lines.forEach(function(l){
        var cl = calcLine(it, l, q), sub = it.type === "cort" ? cl.base : cl.total;
        rows.push([isoDay(q.updatedAt), q.client.name || "", q.client.phone || "", q.client.calle || q.client.address || "", q.client.numero || "", q.client.colonia || "", q.client.ciudad || "", q.client.estado || "", tn[tabOf(it)],
          it.type === "cort" ? "Cortina " + (it.model || it.name || "") : (it.name || ""), lineLabel(it, l, q, true),
          num(it.price), Math.round(sub * 100) / 100,
          first ? q.total : "", first ? paid : "", first ? Math.max(0, q.total - paid) : ""]);
        first = false;
        if(it.type === "cort" && it.rod){
          rows.push([isoDay(q.updatedAt), q.client.name || "", q.client.phone || "", q.client.calle || q.client.address || "", q.client.numero || "", q.client.colonia || "", q.client.ciudad || "", q.client.estado || "", tn[tabOf(it)],
            it.rod === "hotel" ? "Cortinero hotelero" : "Cortinero", rodLabel(it, l).replace(/^Cortinero( hotelero)? /, ""),
            num(it.rodPrice), Math.round(cl.rod * 100) / 100, "", "", ""]);
        }
      });
    });
  });
  return csvText(rows);
}
function apptsCsv(){
  var rows = [["Fecha","Hora","Cliente","Celular","Calle","Número","Colonia","Ciudad","Estado","Nota","Situación"]];
  db.appts.slice().sort(function(a, b){ return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")); }).forEach(function(a){
    rows.push([a.date, a.time || "", a.name || "", a.phone || "", a.calle || "", a.numero || "", a.colonia || "", a.ciudad || "", a.estado || "", a.note || "", a.done ? "Hecha" : "Pendiente"]);
  });
  return csvText(rows);
}
function sendFiles(files){
  try{
    var fl = files.map(function(f){ return new File([f.text], f.name, {type:f.mime}); });
    if(navigator.canShare && navigator.canShare({files:fl})){
      navigator.share({files:fl, title:"Oligar"}).catch(function(){});
      return;
    }
  }catch(e){}
  files.forEach(function(f){
    try{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([f.text], {type:f.mime}));
      a.download = f.name; document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); }, 500);
    }catch(e){}
  });
  toast("Archivo generado. Si no se descargó, avísame.");
}
function exportExcel(){
  if(!db.quotes.length && !db.appts.length){ toast("No hay nada guardado para exportar"); return; }
  var day = isoDay(Date.now());
  var files = [{name:"Oligar_cotizaciones_" + day + ".csv", mime:"text/csv", text:quotesCsv()}];
  if(db.appts.length) files.push({name:"Oligar_citas_" + day + ".csv", mime:"text/csv", text:apptsCsv()});
  sendFiles(files);
}
function exportBackup(){
  var o = {formato:"oligar-respaldo", version:1, fecha:new Date().toISOString(), quotes:db.quotes, appts:db.appts};
  sendFiles([{name:"Oligar_respaldo_" + isoDay(Date.now()) + ".json", mime:"application/json", text:JSON.stringify(o)}]);
}
function mergeBackup(o){
  if(!o || o.formato !== "oligar-respaldo" || !Array.isArray(o.quotes) || !Array.isArray(o.appts)) return null;
  var add = 0, upd = 0;
  [[db.quotes, o.quotes], [db.appts, o.appts]].forEach(function(pair){
    var arr = pair[0];
    pair[1].forEach(function(x){
      if(!x || typeof x.id !== "string") return;
      var ex = arr.filter(function(y){ return y.id === x.id; })[0];
      if(!ex){ arr.push(x); add++; }
      else if((x.updatedAt || x.createdAt || 0) > (ex.updatedAt || ex.createdAt || 0)){ arr[arr.indexOf(ex)] = x; upd++; }
    });
  });
  return {add:add, upd:upd};
}
function importFile(file){
  var r = new FileReader();
  r.onload = function(){
    var o = null; try{ o = JSON.parse(String(r.result)); }catch(e){}
    var res = mergeBackup(o);
    if(!res){ toast("Ese archivo no es un respaldo de Oligar"); return; }
    persist(); if(view === "saved") fillSaved();
    toast("Importado: " + res.add + " nuevas, " + res.upd + " actualizadas");
  };
  r.onerror = function(){ toast("No se pudo leer el archivo"); };
  r.readAsText(file);
}

    q.updatedAt = Date.now(); persist();
    var y = window.scrollY; renderStats(); window.scrollTo(0, y);
  }
});
(function(){
  var sx = 0, sy = 0, el = null;
  var app = $("#app");
  app.addEventListener("touchstart", function(e){ var c = e.target.closest ? e.target.closest("[data-aid]") : null; el = c; if(c && e.touches[0]){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
  app.addEventListener("touchend", function(e){
    if(!el || !e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy, id = el.dataset.aid; el = null;
    if(dx < -90 && Math.abs(dy) < 45){
      var ap = null; db.appts.forEach(function(x){ if(x.id === id) ap = x; });
      if(!ap) return;
      ap.done = !ap.done; ap.updatedAt = Date.now(); persist(); reflow(); toast(ap.done ? "Cita marcada como hecha" : "Cita reabierta");
    }
  }, {passive:true});
})();

$("#l-reset").addEventListener("click", doReset);
try{
  history.replaceState({o:0}, "");
  /* En Android, un paso de historial solo cuenta si se crea tras un gesto real (soltar el dedo, clic, tecla). Por eso se asegura en cada uno. */
  var ensureBack = function(){ try{ if(!history.state || history.state.o !== 1) history.pushState({o:1}, ""); }catch(e){} };
  ["touchend","pointerup","click","keydown"].forEach(function(n){ document.addEventListener(n, ensureBack, {capture:true, passive:true}); });
  window.addEventListener("popstate", function(){
    if(appBack()) history.pushState({o:1}, ""); else toast("Presiona atrás otra vez para salir");
  });
  $("#backbtn").addEventListener("click", function(){ appBack(); });
}catch(e){}
lastPS = pricesStr();

if(auth && auth.refresh) startSync(); else { auth = null; showLogin(""); }
go("new");
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener("load", function(){ navigator.serviceWorker.register("service-worker.js").catch(function(){}); }); }
